<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showroom AI Coach V6 PRO</title>
<style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#111827;--muted:#6b7280;--line:#e6eaf0;--brand:#111827;--blue:#2f6df6;--green:#159566;--amber:#b7791f;--red:#c73a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif}
.shell{max-width:1240px;margin:auto;padding:24px}.nav{height:64px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:850;font-size:21px;letter-spacing:-.03em}.pro{font-size:10px;border:1px solid #ccd3df;padding:4px 7px;border-radius:999px;margin-left:8px}
.tabs{display:flex;gap:8px}.tabs button{border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:700;color:#667085;cursor:pointer}.tabs button.active{background:#fff;color:#111827;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.status{font-size:12px;border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px}.ok{color:var(--green)}.bad{color:var(--red)}
.hero{background:linear-gradient(140deg,#10182d,#202f58);color:#fff;border-radius:26px;padding:30px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.hero h1{font-size:34px;line-height:1.1;margin:0 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:#d3d9e6;line-height:1.65;max-width:720px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:340px}.kpi div{background:rgba(255,255,255,.08);padding:14px;border-radius:14px}.kpi b{display:block;font-size:23px}.kpi span{font-size:11px;color:#d7deeb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(15,23,42,.03)}.card h2,.card h3{margin:0 0 8px}.muted{font-size:13px;color:var(--muted);line-height:1.55}
.btn{border:1px solid #d8dee8;background:#fff;padding:10px 14px;border-radius:11px;font-weight:760;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:#111827;color:white;border-color:#111827}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{height:9px;background:#edf0f4;border-radius:999px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f6df6,#6d8dff)}.section{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}
.voicePanel{display:grid;grid-template-columns:1fr 1fr;gap:14px}.seg{display:flex;background:#f1f3f6;padding:4px;border-radius:12px}.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;color:#6b7280;cursor:pointer}.seg button.on{background:#fff;color:#111827;box-shadow:0 1px 5px rgba(0,0,0,.08)}.label{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:#8a94a3;margin-bottom:7px}
.script{font-size:18px;line-height:1.85;white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);padding:20px;border-radius:16px;margin:15px 0}.record{padding:18px;border-radius:16px;border:1px dashed #ccd3df;background:#fcfdff}audio{width:100%;margin-top:13px}
.scoreHero{display:flex;align-items:center;gap:18px;margin:20px 0}.big{font-size:74px;font-weight:900;line-height:1;letter-spacing:-.05em}.badge{font-size:11px;font-weight:850;background:#eef2f6;padding:6px 9px;border-radius:999px;display:inline-block}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.scoregrid div{background:#f6f7f9;padding:14px;border-radius:13px}.scoregrid b{display:block;font-size:27px}.scoregrid span{font-size:11px;color:#6b7280}.issue{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.issue:last-child{border-bottom:0}.badText{color:var(--red);font-weight:800}
.notice{background:#fff5e6;color:#7a4c00;border:1px solid #ffe0ad;padding:13px 15px;border-radius:13px;font-size:13px;margin-bottom:15px}.weakTag{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:999px;margin:4px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:#7b8492;font-size:11px;text-transform:uppercase}
@media(max-width:860px){.grid2,.voicePanel,.scoregrid,.kpi{grid-template-columns:1fr 1fr}.hero{display:block}.kpi{margin-top:20px;min-width:0}.shell{padding:14px}}
</style></head><body><div id="app" class="shell"></div>
<script>
const DATA=[{"name": "ByteDance Showroom", "sections": [{"title": "Company History", "items": [{"id": "p0s0i0", "text": "Hello everyone, welcome to our company.", "critical": [], "difficult": []}, {"id": "p0s0i1", "text": "I'm xxx, and I will be your guide today to give you a brief overview of our company's history and then guide you through our exhibition area.", "critical": [], "difficult": ["exhibition", "company's"]}]}, {"title": "2012年", "items": [{"id": "p0s1i0", "text": "Here we have the history wall of our company.", "critical": [], "difficult": []}, {"id": "p0s1i1", "text": "Founded in March 2012, our company is a fast-growing Internet technology company.", "critical": [], "difficult": ["fast-growing", "technology"]}, {"id": "p0s1i2", "text": "In our early days, we created 12 applications to test the market.", "critical": [], "difficult": ["applications"]}, {"id": "p0s1i3", "text": "Later, in July, Toutiao stood out from all these apps and was officially launched.", "critical": ["Toutiao"], "difficult": ["officially"]}, {"id": "p0s1i4", "text": "It is a product with a personalized information recommendation engine, dedicated to connecting people and information, allowing high-quality information to be efficiently and accurately distributed, which is quite time-saving for our users to find the content they're interested in.", "critical": [], "difficult": ["recommendation", "high-quality", "personalized", "distributed", "efficiently", "information"]}]}, {"title": "2013年", "items": [{"id": "p0s2i0", "text": "Just 6 months after its release, Toutiao's daily active users (in short DAU) exceeded one million.", "critical": ["Toutiao"], "difficult": ["Toutiao's"]}, {"id": "p0s2i1", "text": "In August that year, Toutiao started its monetization efforts.", "critical": ["Toutiao"], "difficult": ["monetization"]}]}, {"title": "2014年", "items": [{"id": "p0s3i0", "text": "In February 2014, our very first branch office was established in Shanghai.", "critical": [], "difficult": ["established"]}, {"id": "p0s3i1", "text": "In September, Toutiao's DAU exceeded 10 million, which is quite amazing to achieve in such a short time.", "critical": ["Toutiao"], "difficult": ["September", "Toutiao's"]}, {"id": "p0s3i2", "text": "In December, we launched Toutiao Video, which was upgraded to the current Xigua Video in June 2017.", "critical": ["Toutiao"], "difficult": []}, {"id": "p0s3i3", "text": "As a leading medium-length video platform in China, Xigua Video continuously provides high-quality content for diverse audiences.)", "critical": [], "difficult": ["medium-length", "continuously", "high-quality", "audiences"]}]}, {"title": "2016年", "items": [{"id": "p0s4i0", "text": "In Sep 2016, our beloved short video platform Douyin was launched.", "critical": ["Douyin"], "difficult": []}, {"id": "p0s4i1", "text": "It enables users to express themselves and showcase their beautiful life moments.", "critical": [], "difficult": ["themselves", "beautiful"]}, {"id": "p0s4i2", "text": "The DAU now exceeds 600 million, making it one of the most popular short video platforms on the market.", "critical": [], "difficult": ["platforms"]}]}, {"title": "2017年", "items": [{"id": "p0s5i0", "text": "In May 2017, the Lark office suite was launched internally and its Chinese name was changed to Feishu in Jan. 2019.", "critical": ["Feishu", "Lark"], "difficult": ["internally"]}, {"id": "p0s5i1", "text": "It's a one-stop enterprise collaboration platform which combines essential collaboration tools, such as instant communication, smart calendars, audio and video conferencing, mailboxes, cloud disks, etc.", "critical": [], "difficult": ["collaboration", "communication", "conferencing", "enterprise", "calendars", "essential"]}, {"id": "p0s5i2", "text": "（ Since its official release in Aug. 2019, it has continuously acquired established companies from different industries as customers, such as XiaomiInc, LEADING IDEAL, H World Group Limited.", "critical": [], "difficult": ["continuously", "established", "industries", "companies", "customers", "different"]}, {"id": "p0s5i3", "text": "Feishu improves enterprise efficiency in an all-round way, and provides security for enterprises. ）", "critical": ["Feishu"], "difficult": ["enterprises", "efficiency", "enterprise", "all-round"]}, {"id": "p0s5i4", "text": "We've placed lark client logo walls in many airports across cities like Beijing, Shanghai, Guangzhou, and Shenzhen, to show that lark has continuously acquired established companies from different industries as customers, such as Xiaomi, LEADING IDEAL, H World Group Limited.", "critical": ["Lark"], "difficult": ["continuously", "established", "industries", "companies", "customers", "different"]}, {"id": "p0s5i5", "text": "Feishu improves enterprise efficiency in an all-round way, and provides security for enterprises.", "critical": ["Feishu"], "difficult": ["enterprises", "efficiency", "enterprise", "all-round"]}]}, {"title": "2019年", "items": [{"id": "p0s6i0", "text": "2019 is also an important year for us.", "critical": [], "difficult": ["important"]}, {"id": "p0s6i1", "text": "In Jan., Ocean Engine was launched.", "critical": ["Ocean Engine"], "difficult": []}, {"id": "p0s6i2", "text": "Ocean Engine is a comprehensive digital marketing platform, and drives marketing power through intelligent technology to shape the way brands connect with consumers in the Chinese market.", "critical": ["Ocean Engine"], "difficult": ["comprehensive", "intelligent", "technology", "consumers", "marketing"]}, {"id": "p0s6i3", "text": "In May, CapCut was released.", "critical": ["CapCut"], "difficult": []}, {"id": "p0s6i4", "text": "It's Douyin's official editing tool which enables users to easily cut and edit videos.", "critical": ["Douyin"], "difficult": []}, {"id": "p0s6i5", "text": "By March 2020, it has become one of the most popular mobile video editing tools in China.", "critical": [], "difficult": []}, {"id": "p0s6i6", "text": "In Nov., Fanqie Novel was released.", "critical": ["Fanqie"], "difficult": []}, {"id": "p0s6i7", "text": "It is a free reading application, which is committed to creating a great reading experience for users, and providing them with access to a variety of genres in the forms of ebook and audiobook.", "critical": [], "difficult": ["application", "experience", "audiobook", "committed", "providing"]}]}, {"title": "2020年", "items": [{"id": "p0s7i0", "text": "In June of 2020, Volcano Engine was launched officially.", "critical": ["Volcano Engine"], "difficult": ["officially"]}, {"id": "p0s7i1", "text": "It is a cloud service platform, aiming to provide services to enterprises.", "critical": [], "difficult": ["enterprises"]}, {"id": "p0s7i2", "text": "By offering products and services related to cloud foundation, video and content distribution, big data, artificial intelligence, development and operation, we help our customers achieve sustainable growth through digital transformation.", "critical": [], "difficult": ["transformation", "distribution", "intelligence", "development", "sustainable", "artificial"]}]}, {"title": "2021年", "items": [{"id": "p0s8i0", "text": "Now let's move on to 2021.", "critical": [], "difficult": []}, {"id": "p0s8i1", "text": "In April, Douyin started its \"interest-based e-commerce\".", "critical": ["Douyin"], "difficult": ["interest-based", "e-commerce"]}, {"id": "p0s8i2", "text": "The core of it is to proactively help users find their potential shopping needs by connecting them with the target products.", "critical": [], "difficult": ["proactively", "connecting", "potential"]}, {"id": "p0s8i3", "text": "Also, Douyin has rolled out some measures to help creators deepen cooperation with more brands so as to provide more high-quality goods at affordable prices for their followers.", "critical": ["Douyin"], "difficult": ["high-quality", "cooperation", "affordable", "followers"]}, {"id": "p0s8i4", "text": "Later in Sep., we acquired PICO to build up the VR business.", "critical": ["PICO"], "difficult": []}, {"id": "p0s8i5", "text": "We combine the content ecology brought by Douyin and Xigua Video with the hardware development of PICO, hoping to make new breakthroughs in the field of VR.", "critical": ["Douyin", "PICO"], "difficult": ["breakthroughs", "development"]}]}, {"title": "2022年", "items": [{"id": "p0s9i0", "text": "In April 2022, the music streaming application Soda music was launched.", "critical": [], "difficult": ["application", "streaming"]}, {"id": "p0s9i1", "text": "It helps users find attractive music via accurate recommendation technology.", "critical": [], "difficult": ["recommendation", "attractive", "technology"]}, {"id": "p0s9i2", "text": "In November, Douyin Group became a licensed broadcaster of the Qatar World Cup.", "critical": ["Douyin"], "difficult": ["broadcaster"]}, {"id": "p0s9i3", "text": "Leveraging its independently developed low latency and UHD live(ultra high definition live) technologies, the company provided high-quality live broadcasts of the matches to 600 million Douyin users.", "critical": ["Douyin"], "difficult": ["independently", "high-quality", "technologies", "broadcasts", "definition", "Leveraging"]}]}, {"title": "2023年", "items": [{"id": "p0s10i0", "text": "Fast forward to 2023, as artificial intelligence, especially large language models, has captured global attention, we also took advantage of our tech strengths and market insights to roll out some new products.", "critical": [], "difficult": ["intelligence", "artificial", "especially", "advantage", "attention", "strengths"]}, {"id": "p0s10i1", "text": "First, in March , the AI assistant Doubao （Dola）was officially launched, and we will try it later.", "critical": ["Doubao"], "difficult": ["officially", "assistant"]}, {"id": "p0s10i2", "text": "in June, we introduced \"Volcano Ark,\" a large model service platform.", "critical": [], "difficult": ["introduced"]}, {"id": "p0s10i3", "text": "This platform connects developers and users of large models, offering services like fine-tuning, a model marketplace, and testing.", "critical": [], "difficult": ["fine-tuning", "marketplace", "developers"]}, {"id": "p0s10i4", "text": "Now, over 70% of large model developers in the country are on board.", "critical": [], "difficult": ["developers"]}, {"id": "p0s10i5", "text": "Then in November, we announced Al-powered products including lark Al Companion.", "critical": ["Lark"], "difficult": ["Al-powered", "announced", "Companion", "including"]}, {"id": "p0s10i6", "text": "And this AI companion can be a great helper at work because it can help us to organize projects, analyze complex data, and even build systems quickly, making daily collaboration more efficient and significantly boosting productivity.", "critical": [], "difficult": ["collaboration", "significantly", "productivity", "companion", "efficient"]}]}, {"title": "2024年", "items": [{"id": "p0s11i0", "text": "In May 2024, ByteDance launched its self-developed large language model and named it Doubao, sharing the same name as the Doubao app.", "critical": ["ByteDance", "Doubao"], "difficult": ["self-developed", "ByteDance"]}, {"id": "p0s11i1", "text": "Currently, Doubao features 17 different modalities, including large language model, speech model, and vision model.. it also provides external services through Volcano Engine.", "critical": ["Volcano Engine", "Doubao"], "difficult": ["modalities", "Currently", "different", "including"]}, {"id": "p0s11i2", "text": "In July, Dreamina was officially launched.", "critical": [], "difficult": ["officially"]}, {"id": "p0s11i3", "text": "Developed by CapCut team, it is an all-in-one AI creation tool.", "critical": ["CapCut"], "difficult": ["all-in-one", "Developed"]}, {"id": "p0s11i4", "text": "Powered by self-developed models, it supports text-to-image, text-to-video and digital human generation, focusing on enabling effortless content creation with no technical barriers.", "critical": [], "difficult": ["self-developed", "text-to-image", "text-to-video", "effortless", "generation", "technical"]}]}, {"title": "2025年", "items": [{"id": "p0s12i0", "text": "At the end of 2025, we have been announced to be the exclusive AI and cloud partner of the Spring Festival Gala, which is called 春节联欢晚会 in mandarin.", "critical": ["Spring Festival Gala"], "difficult": ["announced", "exclusive"]}, {"id": "p0s12i1", "text": "So that's all for the milestones in the past 14 years.", "critical": [], "difficult": ["milestones"]}, {"id": "p0s12i2", "text": "Now, please follow me to the exhibition area where we can see how these smart zones come into life.", "critical": [], "difficult": ["exhibition"]}, {"id": "p0s12i3", "text": "This way please.", "critical": [], "difficult": []}, {"id": "p0s12i4", "text": "That's all for the milestones in the past 14 years.", "critical": [], "difficult": ["milestones"]}]}, {"title": "Livestreaming studio:", "items": [{"id": "p0s13i0", "text": "This space faithfully recreates a live streaming scene.", "critical": [], "difficult": ["faithfully", "recreates", "streaming"]}, {"id": "p0s13i1", "text": "In recent years, Douyin's live streaming commerce has grown rapidly, revolutionizing traditional e-commerce models.", "critical": ["Douyin"], "difficult": ["revolutionizing", "traditional", "e-commerce", "streaming"]}, {"id": "p0s13i2", "text": "Unlike conventional platforms where users actively search for products based on predefined needs (\"consumer-seeking-products\"), Douyin leverages its Al-driven interest-based recommendation algorithms to analyze users' video-watching habits and preferences.", "critical": ["Douyin"], "difficult": ["consumer-seeking-products", "interest-based", "recommendation", "video-watching", "conventional", "preferences"]}, {"id": "p0s13i3", "text": "This allows the platform to proactively suggest relevant or appealing items to users--even before they recognize a specific desire--effectively transforming the dynamic into--products finding consumers.", "critical": [], "difficult": ["desire--effectively", "into--products", "transforming", "proactively", "users--even", "appealing"]}, {"id": "p0s13i4", "text": "We also provide an opportunity for two volunteers to try live streeaming. who would like to sit on the chairs and experience how it feels to be a host of a live streamer.", "critical": [], "difficult": ["opportunity", "experience", "streeaming", "volunteers"]}, {"id": "p0s13i5", "text": "We won’t upload your personal information.", "critical": [], "difficult": ["information"]}, {"id": "p0s13i6", "text": "And we need a volunteer to join in to be an assistant.", "critical": [], "difficult": ["assistant", "volunteer"]}, {"id": "p0s13i7", "text": "Others can join in by pressing these buttons to give them likes, send gifts and links.", "critical": [], "difficult": []}]}, {"title": "Doubao:", "items": [{"id": "p0s14i0", "text": "This is the AI assistant we developed in 2023, which represents the outcome of the company’s long-term exploration and practice in the field of large models.Now, Let Doubao greet[ɡriːt] us in a special way, and we can just try out its music generation feature.", "critical": ["Doubao"], "difficult": ["exploration", "generation", "represents", "assistant", "developed", "long-term"]}, {"id": "p0s14i1", "text": "Doubao has also achieved remarkable breakthroughs in the new year.", "critical": ["Doubao"], "difficult": ["breakthroughs", "remarkable"]}, {"id": "p0s14i2", "text": "First, the image generation model Seedream 5.0 Lite has been comprehensively upgraded in three core capabilities: cross-modal understanding and reasoning, precise instruction following, and real-time web-connected retrieval.", "critical": ["Seedream"], "difficult": ["comprehensively", "understanding", "web-connected", "capabilities", "cross-modal", "instruction"]}, {"id": "p0s14i3", "text": "In addition, the video generation model Seedance 2.0 has achieved overall improvements in instruction following, physical logic understanding, and other capabilities.", "critical": ["Seedance"], "difficult": ["understanding", "capabilities", "improvements", "instruction", "generation", "following"]}, {"id": "p0s14i4", "text": "This year’s Spring Festival Gala has also deeply integrated AI technology into stage creation.", "critical": ["Spring Festival Gala"], "difficult": ["integrated", "technology"]}, {"id": "p0s14i5", "text": "In commercial applications, merchants can use these models to quickly change background images and songs.", "critical": [], "difficult": ["applications", "background", "commercial", "merchants"]}, {"id": "p0s14i6", "text": "This enables them to create diverse content materials for various platforms during holidays and marketing events, driving commercial innovation and marketing.", "critical": [], "difficult": ["commercial", "innovation", "marketing", "materials", "platforms"]}]}, {"title": "Ancient book：", "items": [{"id": "p0s15i0", "text": "In addition to commercial applications, our technology plays a key role in preserving cultural heritage, such as ancient books, which are an essential part of traditional Chinese culture.", "critical": [], "difficult": ["applications", "traditional", "commercial", "preserving", "technology", "essential"]}, {"id": "p0s15i1", "text": "In 2020, we partnered with Peking University and the National Library of China to create a digital platform for ancient books.", "critical": [], "difficult": ["University", "partnered"]}, {"id": "p0s15i2", "text": "Using our advanced Optical Character Recognition (OCR) technology, we can rapidly scan and identify text from images of ancient manuscripts.", "critical": ["OCR"], "difficult": ["manuscripts", "Recognition", "technology", "Character"]}, {"id": "p0s15i3", "text": "Beyond text recognition, another technology that has made major contributions is Natural Language Processing (NLP) technology, which can enhance readability by adding pauses and punctuation to align with modern reading habits.", "critical": ["NLP"], "difficult": ["contributions", "punctuation", "readability", "recognition", "Processing", "technology"]}, {"id": "p0s15i4", "text": "One of the highlights on our digital platform for ancient books is The Analects, a fundamental literature in Chinese philosophy and culture.", "critical": ["Analects"], "difficult": ["fundamental", "highlights", "literature", "philosophy"]}, {"id": "p0s15i5", "text": "The Analects, attributed to Confucius and his disciples, is a collection of teachings, discussions, and thoughts on ethics, government, and personal conduct.", "critical": ["Analects"], "difficult": ["discussions", "attributed", "collection", "government", "Confucius", "disciples"]}, {"id": "p0s15i6", "text": "It has shaped moral and philosophical thinking for over two millennia and still remains deeply relevant today.", "critical": [], "difficult": ["philosophical", "millennia"]}, {"id": "p0s15i7", "text": "Through our platform, viewers can not only explore the original text but also view translations that bring new perspectives to these timeless teachings.", "critical": [], "difficult": ["perspectives", "translations", "teachings"]}, {"id": "p0s15i8", "text": "With just a few clicks, you can select sections of The Analects, see its translation, and gain insight into its profound wisdom.", "critical": ["Analects"], "difficult": ["translation"]}, {"id": "p0s15i9", "text": "In 2022, we collaborated with the National Library of China to launch the *Yongle Encyclopedia* on our digital platform.", "critical": ["Yongle Encyclopedia"], "difficult": ["collaborated", "Encyclopedia"]}, {"id": "p0s15i10", "text": "As a national cultural treasure, the original volumes are rarely accessible to the public.", "critical": [], "difficult": ["accessible"]}, {"id": "p0s15i11", "text": "To bridge this gap, we used Web3D technology along with digital light and shadow effects to recreate a realistic 3D model of the encyclopedia, faithfully restoring its original appearance.", "critical": ["Web3D"], "difficult": ["encyclopedia", "appearance", "faithfully", "technology", "realistic", "restoring"]}, {"id": "p0s15i12", "text": "This allows users to explore the inner pages and engage with a wealth of original texts, bringing this priceless heritage to life.", "critical": [], "difficult": ["priceless"]}, {"id": "p0s15i13", "text": "To support the revitalization and application of ancient books, we have leveraged platforms such as Douyin, Toutiao, and Fanqie Novel to bring these physical books to life through technology and creativity—via online creative campaigns, open lectures, essay contests and more.", "critical": ["Douyin", "Toutiao", "Fanqie"], "difficult": ["revitalization", "application", "creativity", "technology", "campaigns", "leveraged"]}, {"id": "p0s15i14", "text": "Currently, over 30 million users watch content related to ancient books on Douyin every day.", "critical": ["Douyin"], "difficult": ["Currently"]}, {"id": "p0s15i15", "text": "Let’s take a brief look through this video.", "critical": [], "difficult": []}]}, {"title": "employees' charitable initiatives", "items": [{"id": "p0s16i0", "text": "At ByteDance, our employee volunteers are known as \"Tiaotiaotang,\" or \"Popping Candy.\" The name reflects their belief in spreading kindness, hope, and positive change through small acts to make a real difference.", "critical": ["ByteDance"], "difficult": ["Tiaotiaotang", "difference", "volunteers", "ByteDance", "spreading"]}, {"id": "p0s16i1", "text": "As of March this year, more than 150,000 employees have participated in volunteer activities, contributing over 630,000 hours of service.", "critical": [], "difficult": ["contributing", "participated", "activities", "employees", "volunteer"]}, {"id": "p0s16i2", "text": "They have also formed 124 volunteer groups and donated more than RMB 76 million to charitable projects, including ByteDance's matching donations.", "critical": ["ByteDance"], "difficult": ["ByteDance's", "charitable", "donations", "including", "volunteer"]}, {"id": "p0s16i3", "text": "The posters you see here highlight some of the volunteer and community initiatives currently taking place in Shanghai.", "critical": [], "difficult": ["initiatives", "community", "currently", "highlight", "volunteer"]}, {"id": "p0s16i4", "text": "This poster introduces the TiaoTiaoTang Spark Volunteer Community, a charitable organization founded by ByteDance employees in Shanghai in October 2023.", "critical": ["ByteDance"], "difficult": ["organization", "TiaoTiaoTang", "charitable", "introduces", "ByteDance", "Community"]}, {"id": "p0s16i5", "text": "Guided by the belief that AI can make information more accessible, the community organizes volunteer programs focused on digital inclusion, support for seniors and people with disabilities, and childcare initiatives.", "critical": [], "difficult": ["disabilities", "information", "initiatives", "accessible", "childcare", "community"]}, {"id": "p0s16i6", "text": "Through these efforts, volunteers are exploring how technology can remove barriers and create more opportunities for everyone.", "critical": [], "difficult": ["opportunities", "technology", "volunteers", "exploring"]}, {"id": "p0s16i7", "text": "This poster highlights V Gathering · AI Open Mic, a community program launched in Yangpu District.", "critical": [], "difficult": ["highlights", "community", "Gathering"]}, {"id": "p0s16i8", "text": "Since October 2025, the TiaoTiaoTang Spark Volunteer Community has partnered with the Yangpu Cyberspace Administration to host this ongoing serie of events.", "critical": [], "difficult": ["Administration", "TiaoTiaoTang", "Cyberspace", "Community", "partnered", "Volunteer"]}, {"id": "p0s16i9", "text": "To date, the program has held more than 20 sessions, attracting over 2,000 participants.", "critical": [], "difficult": ["participants", "attracting"]}, {"id": "p0s16i10", "text": "Topics have ranged from AI-powered content creation and coding, to AI agent development, and other emerging technologies, making AI more approachable and helping people discover its real-world potential.", "critical": [], "difficult": ["approachable", "technologies", "development", "AI-powered", "real-world", "potential"]}, {"id": "p0s16i11", "text": "This photo showcases our Hello AI Silver Age Class, a community program held at Xiafu Nursing Home in Yangpu District.", "critical": [], "difficult": ["community", "showcases"]}, {"id": "p0s16i12", "text": "The program is designed to help seniors build digital skills and gain confidence using AI in their everyday lives.", "critical": [], "difficult": ["confidence"]}, {"id": "p0s16i13", "text": "In addition to learning about AI tools, short-video creation, digital literacy, health information, and online safty, participants can also take part in fun activities such as AI photo restoration, digital avatars creation, and AI creativity competitions.", "critical": [], "difficult": ["competitions", "participants", "information", "restoration", "short-video", "activities"]}, {"id": "p0s16i14", "text": "Through these activities, we hope to make technology more accessible, engaging, and rewarding for seniors, helping them navigate and enjoy life in the digital age.", "critical": [], "difficult": ["accessible", "activities", "technology", "rewarding"]}]}, {"title": "pico", "items": [{"id": "p0s17i0", "text": "Next, let's move on to the final exhibit of today’s tour.", "critical": [], "difficult": []}, {"id": "p0s17i1", "text": "The video playing continuously on the screen is from our PICO.", "critical": ["PICO"], "difficult": ["continuously"]}, {"id": "p0s17i2", "text": "In 2021, we acquired PICO to build up our VR business.", "critical": ["PICO"], "difficult": []}, {"id": "p0s17i3", "text": "Leveraging the rich content ecosystem of platforms such as Douyin and Xigua Video, combined with PICO’s hardware development capabilities, we deliver a variety of immersive VR experiences to users.", "critical": ["Douyin", "PICO"], "difficult": ["capabilities", "development", "experiences", "Leveraging", "ecosystem", "immersive"]}, {"id": "p0s17i4", "text": "The film we are watching now showcases the Mogao Caves, also known as the Thousand-Buddha Caves.", "critical": [], "difficult": ["Thousand-Buddha", "showcases"]}, {"id": "p0s17i5", "text": "Carved into the cliffs over a millennium ago in Dunhuang along China's ancient Silk Road, they create a multidimensional artistic space combining cave architecture, murals, and sculptures.", "critical": [], "difficult": ["multidimensional", "architecture", "millennium", "sculptures", "combining"]}, {"id": "p0s17i6", "text": "To truly restore the mural contents, we have adopted high-precision 3D modeling and real-time rendering technologies, which enable a three-sixty panoramic display of the caves.", "critical": [], "difficult": ["high-precision", "technologies", "three-sixty", "panoramic", "real-time", "rendering"]}, {"id": "p0s17i7", "text": "This allows users to immerse themselves in the visual feast of Dunhuang culture.", "critical": [], "difficult": ["themselves"]}, {"id": "p0s17i8", "text": "In addition to experiencing the scenery immersively through videos, our VR headsets also support interactive sports such as tennis,badminton, as well as a wide range of applications in gaming, education, and healthcare.", "critical": [], "difficult": ["applications", "experiencing", "immersively", "interactive", "healthcare", "badminton"]}]}, {"title": "Douyin Music:", "items": [{"id": "p0s18i0", "text": "And here is Douyin music showcase!", "critical": ["Douyin"], "difficult": []}, {"id": "p0s18i1", "text": "Besides the Soda Music app that I mentioned earlier, Douyin Music also includes a brand called Galaxy Ark, which offers full services for musicians and music companies.", "critical": ["Douyin"], "difficult": ["companies", "mentioned", "musicians"]}, {"id": "p0s18i2", "text": "And we also support independent artists through our Open Platform for Musicians.", "critical": [], "difficult": ["independent", "Musicians"]}, {"id": "p0s18i3", "text": "Here, you can see some vinyl records and albums we've created with some amazing artists and labels.", "critical": [], "difficult": []}, {"id": "p0s18i4", "text": "Feel free to put on the headphones and enjoy the music!", "critical": [], "difficult": ["headphones"]}]}, {"title": "Data Analysis Screen:", "items": [{"id": "p0s19i0", "text": "Just now, you got a taste of what it’s like to be a live streamer. (If the visitor didn’t participate, say:) You saw our simulated livestream setup.", "critical": [], "difficult": ["participate", "livestream", "simulated"]}, {"id": "p0s19i1", "text": "After a livestream ends, we also provide a comprehensive review of the host’s performance and the sales outcomes.", "critical": [], "difficult": ["comprehensive", "performance", "livestream"]}, {"id": "p0s19i2", "text": "What you’re looking at now is the interface for Volcano engine's Live Insight product.", "critical": ["Volcano Engine"], "difficult": ["interface"]}, {"id": "p0s19i3", "text": "It is built with Volcano engine's AI recognition, understanding, and clustering technology, combined with official data from Douyin live streams.", "critical": ["Volcano Engine", "Douyin"], "difficult": ["understanding", "recognition", "clustering", "technology"]}, {"id": "p0s19i4", "text": "It offers businesses a detailed analysis of their live streams on Douyin, helping them see what’s working well and what needs improvement.", "critical": ["Douyin"], "difficult": ["improvement", "businesses"]}, {"id": "p0s19i5", "text": "Let me explain how this product works.", "critical": [], "difficult": []}, {"id": "p0s19i6", "text": "It records the live stream and uses AI to analyze the whole process.", "critical": [], "difficult": []}, {"id": "p0s19i7", "text": "Here, you can see the different speech patterns of the host that our AI has grouped together.", "critical": [], "difficult": ["different"]}, {"id": "p0s19i8", "text": "We then link this analyzed data with user interactions and sales data, so as to help our enterprise clients understand what the host said that interested the viewers, and which phrases boosted engagement and sales, so they would know more clearly how to optimize the live stream.", "critical": [], "difficult": ["interactions", "engagement", "enterprise", "interested", "understand"]}]}, {"title": "Crafts:", "items": [{"id": "p0s20i0", "text": "And Everyone now, please turn around.", "critical": [], "difficult": []}, {"id": "p0s20i1", "text": "You could see there are several cultural and creative products that Douyin has developed with artisans.", "critical": ["Douyin"], "difficult": ["developed"]}, {"id": "p0s20i2", "text": "We know that many traditional crafts are at risk of being lost, so Douyin launched a project to revitalize these traditional skills, bringing them closer to modern people's life.", "critical": ["Douyin"], "difficult": ["traditional", "revitalize"]}, {"id": "p0s20i3", "text": "Here, you can see beautifully crafted items like Longquan celadon, Jialu paper umbrellas, and Fujian lacquerware.", "critical": [], "difficult": ["beautifully", "lacquerware", "umbrellas"]}, {"id": "p0s20i4", "text": "These pieces preserve the essence of traditional craftsmanship while incorporating modern design elements, making them both stylish and practical.", "critical": [], "difficult": ["craftsmanship", "incorporating", "traditional", "practical"]}, {"id": "p0s20i5", "text": "We hope that through the power of design, we can truly help artisans monetize their skills, solve the challenges of traditional craft development, and allow more people to discover and appreciate these timeless crafts.", "critical": [], "difficult": ["development", "traditional", "appreciate", "challenges"]}]}, {"title": "Feishu:", "items": [{"id": "p0s21i0", "text": "And it is also provided for business clients to help them achieve rapid growth.", "critical": [], "difficult": []}, {"id": "p0s21i1", "text": "We've placed Feishu client logo walls in many airports across cities like Beijing, Shanghai, Guangzhou, and Shenzhen, to show that many companies from numerous industries have choosen Lark for their office needs.", "critical": ["Feishu", "Lark"], "difficult": ["industries", "companies", "Guangzhou"]}, {"id": "p0s21i2", "text": "We will explore more about Feishu’s features in our exhibition hall later.", "critical": ["Feishu"], "difficult": ["exhibition"]}, {"id": "p0s21i3", "text": "And now, let's watch a video that shows a simulated business report involving top executives, and see how Feishu (Lark) breaks the barriers of time, space, and language.", "critical": ["Feishu", "Lark"], "difficult": ["executives", "involving", "simulated"]}, {"id": "p0s21i4", "text": "(play the video)", "critical": [], "difficult": []}, {"id": "p0s21i5", "text": "I’m sure now you have a better understanding of how Feishu enhances collaboration and streamlines information flow.", "critical": ["Feishu"], "difficult": ["collaboration", "understanding", "information", "streamlines"]}, {"id": "p0s21i6", "text": "The meeting you saw in the video is something that happens every day in our company—efficient meetings have become an important part of our daily work.", "critical": [], "difficult": ["efficient", "important", "something"]}, {"id": "p0s21i7", "text": "In fact, according to a survey we conducted with our clients, for a company with 1,000 employees, using Feishu can cut meeting times by an average of 37%, saving the company 62,000 hours each year, and reducing internal service costs by over 8.6 million yuan, which is about 1.2 million dollars.", "critical": ["Feishu"], "difficult": ["according", "conducted", "employees"]}, {"id": "p0s21i8", "text": "Moving forward, Feishu will continue refining its products to help more businesses achieve efficient collaboration", "critical": ["Feishu"], "difficult": ["collaboration", "businesses", "efficient"]}]}]}, {"name": "Volcano Engine Innovation Experience Center", "sections": [{"title": "开头", "items": [{"id": "p1s0i0", "text": "Ladies and gentlemen, welcome to the Volcano Engine Innovation Experience Center in Shanghai.", "critical": ["Volcano Engine"], "difficult": ["Experience", "Innovation", "gentlemen"]}, {"id": "p1s0i1", "text": "My name is XXX, and it is my great pleasure to show you around today.", "critical": [], "difficult": []}, {"id": "p1s0i2", "text": "During this visit, we'll explore Volcano Engine's key products, business implementation, and social responsibility efforts.", "critical": ["Volcano Engine"], "difficult": ["implementation", "responsibility"]}, {"id": "p1s0i3", "text": "Just a gentle reminder, some of the content in this exhibition hall is confidential, so we kindly ask that you refrain from taking photos or videos.", "critical": [], "difficult": ["confidential", "exhibition"]}, {"id": "p1s0i4", "text": "Thank you for your cooperation.", "critical": [], "difficult": ["cooperation"]}, {"id": "p1s0i5", "text": "In recent years, AI large models have gained significant attention worldwide.", "critical": [], "difficult": ["significant", "attention", "worldwide"]}, {"id": "p1s0i6", "text": "First, let’s experience the creative power of the Doubao video generation model through a short video.", "critical": ["Doubao"], "difficult": ["experience", "generation"]}, {"id": "p1s0i7", "text": "This video was created using Seedance 2.0.", "critical": ["Seedance"], "difficult": []}, {"id": "p1s0i8", "text": "Recently, we also officially released our image creation model, Seedream 5.0. lite.", "critical": ["Seedream"], "difficult": ["officially"]}, {"id": "p1s0i9", "text": "In the next section, you'll also see some of its impressive capabilities in action.", "critical": [], "difficult": ["capabilities", "impressive"]}, {"id": "p1s0i10", "text": "Now, please take a look at the screen.", "critical": [], "difficult": []}, {"id": "p1s0i11", "text": "2025 is widely recognized as the \"Inaugural Year of AI\".", "critical": [], "difficult": ["recognized", "Inaugural"]}, {"id": "p1s0i12", "text": "According to statistics from late December 2025, the average daily token usage of Doubao large language models, or LLMs, exceeded 63 trillion, representing more than a 525-fold increase since its release.", "critical": ["Doubao", "LLMs"], "difficult": ["representing", "statistics", "According"]}, {"id": "p1s0i13", "text": "In 2025, more than 1 million enterprises and individuals users adopted Volcano Engine's model services, across over 100 industries.", "critical": ["Volcano Engine"], "difficult": ["enterprises", "individuals", "industries"]}, {"id": "p1s0i14", "text": "So what makes Volcano Engine's model services so trusted by users across industries?", "critical": ["Volcano Engine"], "difficult": ["industries"]}, {"id": "p1s0i15", "text": "Now, please follow me to the center area, and let’s explore more together.", "critical": [], "difficult": []}, {"id": "p1s0i16", "text": "The cube doors are now opening.", "critical": [], "difficult": []}, {"id": "p1s0i17", "text": "The black lines on the floor indicate the movement paths of the equipment, so please watch your step.", "critical": [], "difficult": ["equipment"]}, {"id": "p1s0i18", "text": "Now, let’s move on to the sandbox area.", "critical": [], "difficult": []}]}, {"title": "沙盘", "items": [{"id": "p1s1i0", "text": "The sandbox model in front of us shows ByteDance's R&D Center.", "critical": ["ByteDance"], "difficult": ["ByteDance's"]}, {"id": "p1s1i1", "text": "Let’s watch a video to learn more about the centers located in Beijing, Tianjin, Hebei Province, and Datong in Shanxi Province.", "critical": [], "difficult": []}, {"id": "p1s1i2", "text": "In fact, we are witnessing a technological evolution across three major eras: from the PC era to the mobile internet era, and now to the AI era.", "critical": [], "difficult": ["technological", "witnessing", "evolution"]}, {"id": "p1s1i3", "text": "In the AI era, agents are becoming the new core interaction model.", "critical": [], "difficult": ["interaction"]}, {"id": "p1s1i4", "text": "Let me introduce a breakthrough AI product released at the 2025 Volcano Engine FORCE Conference: AgentKit, an out-of-the-box agent development platform.", "critical": ["Volcano Engine", "AgentKit"], "difficult": ["out-of-the-box", "breakthrough", "development", "Conference", "introduce"]}, {"id": "p1s1i5", "text": "Traditionally, developing a single AI agent would require around 700 lines of core code, plus over 800 additional lines for backend interface orchestration, that is, nearly 1,500 lines of complex coding.", "critical": [], "difficult": ["orchestration", "Traditionally", "additional", "developing", "interface"]}, {"id": "p1s1i6", "text": "However, with AgentKit, the entire process can now be completed with just 61 lines of code.", "critical": ["AgentKit"], "difficult": ["completed"]}, {"id": "p1s1i7", "text": "It is quite shocking, right?", "critical": [], "difficult": []}, {"id": "p1s1i8", "text": "That's not only a dramatic improvement in development efficiency, but also a significant boost of service stability.", "critical": [], "difficult": ["development", "improvement", "significant", "efficiency", "stability"]}, {"id": "p1s1i9", "text": "Volcano Engine is evolving from a technology tool provider into a comprehensive AI agent development platform and ecosystem.", "critical": ["Volcano Engine"], "difficult": ["comprehensive", "development", "technology", "ecosystem"]}, {"id": "p1s1i10", "text": "One of Volcano Engine's core principle is that our internal and external technologies share the same source.", "critical": ["Volcano Engine"], "difficult": ["technologies", "principle"]}, {"id": "p1s1i11", "text": "We are determined to share ByteDance's best-in-class technologies with the world.", "critical": ["ByteDance"], "difficult": ["best-in-class", "technologies", "ByteDance's", "determined"]}, {"id": "p1s1i12", "text": "Next, we will dive deep into four key dimensions: Doubao LLMs, AI + content, AI + transactions, and AI + operations and management.", "critical": ["Doubao", "LLMs"], "difficult": ["transactions", "dimensions", "management", "operations"]}, {"id": "p1s1i13", "text": "First, let’s move on to the Doubao LLMs section.", "critical": ["Doubao", "LLMs"], "difficult": []}, {"id": "p1s1i14", "text": "This way please.", "critical": [], "difficult": []}]}, {"title": "豆包", "items": [{"id": "p1s2i0", "text": "Here comes our friend Doubao.", "critical": ["Doubao"], "difficult": []}, {"id": "p1s2i1", "text": "Has anyone here used it before?", "critical": [], "difficult": []}, {"id": "p1s2i2", "text": "With the rapid development of AI technology, Doubao has become more and more capable across a wide range of scenarios.", "critical": ["Doubao"], "difficult": ["development", "technology", "scenarios"]}, {"id": "p1s2i3", "text": "Next, let's invite Doubao to introduce herself.", "critical": ["Doubao"], "difficult": ["introduce"]}, {"id": "p1s2i4", "text": "Q: Doubao Doubao, could you please introduce yourself?", "critical": ["Doubao"], "difficult": ["introduce"]}, {"id": "p1s2i5", "text": "A: Q: Doubao, today we’re honored to welcome guests from [Company Name].", "critical": ["Doubao"], "difficult": []}, {"id": "p1s2i6", "text": "Could you please give them a warm welcome?", "critical": [], "difficult": []}, {"id": "p1s2i7", "text": "A: Thank you so much, Doubao.", "critical": ["Doubao"], "difficult": []}, {"id": "p1s2i8", "text": "And once again, welcome everyone.", "critical": [], "difficult": []}, {"id": "p1s2i9", "text": "Next, we will focus on our latest model capabilities.", "critical": [], "difficult": ["capabilities"]}, {"id": "p1s2i10", "text": "First, let me introduce our newest image creation model, Seedream 5.0 Lite.", "critical": ["Seedream"], "difficult": ["introduce"]}, {"id": "p1s2i11", "text": "It features major upgrades in three core capabilities: multimodal understanding and reasoning, precise instruction following, and real-time web search.", "critical": [], "difficult": ["understanding", "capabilities", "instruction", "multimodal", "following", "real-time"]}, {"id": "p1s2i12", "text": "This enables users to receive fast responses and highly accurate visual generation results.", "critical": [], "difficult": ["generation", "responses"]}, {"id": "p1s2i13", "text": "as shown on the screen, the girl uses real time search to continuously refine her instructions by adding wings, a saddle, and other decorative elements — ultimately recreating the pony from her childhood dreams.", "critical": [], "difficult": ["continuously", "instructions", "decorative", "recreating", "ultimately", "childhood"]}, {"id": "p1s2i14", "text": "By transforming abstract imagination into vivid visual creations, the model truly brings the concept of “Think It, Create It” to life — delivering a genuine “What You See Is What You Get” experience.", "critical": [], "difficult": ["transforming", "imagination", "delivering", "experience", "creations"]}, {"id": "p1s2i15", "text": "Next, I’d like to invite you to experience our brand-new Expert Model, powered by one of our most advanced models: Seed 2.0 Pro.", "critical": [], "difficult": ["experience", "brand-new"]}, {"id": "p1s2i16", "text": "As you can see in the bottom-left corner of the Doubao app, users can now choose from three different modes: Fast, Think, and Expert.", "critical": ["Doubao"], "difficult": ["bottom-left", "different"]}, {"id": "p1s2i17", "text": "This design allows us to meet the diverse needs of both enterprises and individual users across various scenarios.", "critical": [], "difficult": ["enterprises", "individual", "scenarios"]}, {"id": "p1s2i18", "text": "It also supports real-time AI video calls.", "critical": [], "difficult": ["real-time"]}, {"id": "p1s2i19", "text": "Would anyone like to give it a try?", "critical": [], "difficult": []}, {"id": "p1s2i20", "text": "You can ask about the weather, the latest news, or anything else you’re interested in — feel free to chat with her.", "critical": [], "difficult": ["interested"]}, {"id": "p1s2i21", "text": "Doubao is also capable of AI music generation.", "critical": ["Doubao"], "difficult": ["generation"]}, {"id": "p1s2i22", "text": "Does anyone have a favorite music style or genre?", "critical": [], "difficult": []}, {"id": "p1s2i23", "text": "We can ask Doubao to create a song based on your company name or any keywords you'd like.", "critical": ["Doubao"], "difficult": []}, {"id": "p1s2i24", "text": "(Now, let’s move on to the content section.", "critical": [], "difficult": []}, {"id": "p1s2i25", "text": "This way please.)", "critical": [], "difficult": []}]}, {"title": "内容", "items": [{"id": "p1s3i0", "text": "You may have noticed that when opening apps such as Doubao, Douyin, Toutiao, or Fanqie Novel, you'll often see the phrase “Powered by Volcano Engine” displayed on the launch screen.", "critical": ["Volcano Engine", "Doubao", "Douyin", "Toutiao", "Fanqie"], "difficult": ["displayed"]}, {"id": "p1s3i1", "text": "Apart from daily application scenarios, in recent years, Volcano Engine has also partnered with CCTV Spring Festival Gala on multiple occasions in recent years to help bring traditional Chinese culture to wider audiences", "critical": ["Volcano Engine", "Spring Festival Gala"], "difficult": ["application", "traditional", "audiences", "occasions", "partnered", "scenarios"]}, {"id": "p1s3i2", "text": "In 2024, Volcano Engine provided technical support for the Xi'an venue of Douyin and CCTV Spring Festival Gala celebrating the Year of Dragon.", "critical": ["Volcano Engine", "Douyin", "Spring Festival Gala"], "difficult": ["celebrating", "technical"]}, {"id": "p1s3i3", "text": "The performance \"Poetry Across Chang'an\" soon went viral across social media platforms.", "critical": [], "difficult": ["performance", "platforms"]}, {"id": "p1s3i4", "text": "Using advanced AI and AR technologies, we seamlessly brought the poet Li Bai into the scene.", "critical": [], "difficult": ["technologies", "seamlessly"]}, {"id": "p1s3i5", "text": "Standing atop the ancient city walls, Li Bai was able to interact with modern audiences in a vivid and immersive way — transforming historical imagination into reality.", "critical": [], "difficult": ["transforming", "imagination", "historical", "audiences", "immersive"]}, {"id": "p1s3i6", "text": "I'm also proud to share that, as the exclusive AI cloud partner of the 2026 Spring Festival Gala, Volcano Engine integrated cutting-edge AI technologies, including SeeDance 2.0, Seedream and spatial video generation, into the stage performances, creating multiple memorable moments that resonated with audiences worldwide.", "critical": ["Volcano Engine", "Seedance", "Seedream", "Spring Festival Gala"], "difficult": ["cutting-edge", "performances", "technologies", "generation", "integrated", "audiences"]}, {"id": "p1s3i7", "text": "And next, let's move on to the transaction solutions exhibition area.", "critical": [], "difficult": ["transaction", "exhibition", "solutions"]}]}, {"title": "交易", "items": [{"id": "p1s4i0", "text": "Now, let's move on to the AI commerce and transaction section.", "critical": [], "difficult": ["transaction"]}, {"id": "p1s4i1", "text": "In 2021, we pioneered the concept of interest-based e-commerce.", "critical": [], "difficult": ["interest-based", "e-commerce", "pioneered"]}, {"id": "p1s4i2", "text": "Unlike traditional e-commerce models, our recommendation system connects users with products based on their interests and preferences.", "critical": [], "difficult": ["recommendation", "preferences", "traditional", "e-commerce", "interests"]}, {"id": "p1s4i3", "text": "Let’s now take a look at how brands are putting this into practice.", "critical": [], "difficult": []}, {"id": "p1s4i4", "text": "During the pre-sale phase, Suntory analyzed consumer profiles and preferences, using AI to generate short video scripts tailored to different audiences.", "critical": ["Suntory"], "difficult": ["preferences", "audiences", "different"]}, {"id": "p1s4i5", "text": "They also leveraged data analysis to evaluate consumer feedback on new products, ultimately helping launch their hit product, sugar free oolong tea.", "critical": [], "difficult": ["ultimately", "leveraged"]}, {"id": "p1s4i6", "text": "During the sales process, AI can also help merchants rapidly improve their livestreaming and sales capabilities.", "critical": [], "difficult": ["livestreaming", "capabilities", "merchants"]}, {"id": "p1s4i7", "text": "Before going LIVE, hosts can conduct training sessions in the AI live-streaming rehearsal room, where AI provides targeted suggestions based on overall performance, including presentation style, product highlight coverage, and livestream pacing.", "critical": [], "difficult": ["live-streaming", "presentation", "performance", "suggestions", "livestream", "highlight"]}, {"id": "p1s4i8", "text": "AI can also automatically generate suitable livestream scripts and talking points.", "critical": [], "difficult": ["automatically", "livestream"]}, {"id": "p1s4i9", "text": "In the post-sales phase, brands such as Haidilao use Al to quickly collect and analyze customer feedback, thus enhancing operational efficiency and customer experience.", "critical": ["Haidilao"], "difficult": ["operational", "efficiency", "experience", "post-sales", "enhancing"]}, {"id": "p1s4i10", "text": "Now, let’s move on to the next section.", "critical": [], "difficult": []}]}, {"title": "飞轮", "items": [{"id": "p1s5i0", "text": "Now, we've arrived at the Operations & Management section.", "critical": [], "difficult": ["Management", "Operations"]}, {"id": "p1s5i1", "text": "Our goal is to become a true \"STAR\" tech company -- one that continuously innovates and evolves.", "critical": [], "difficult": ["continuously", "innovates"]}, {"id": "p1s5i2", "text": "One is sector. (Play video after introduction)", "critical": [], "difficult": ["introduction", "solutions"]}, {"id": "p1s6i18", "text": "Education & Research Industry (1 min 28 sec)", "critical": [], "difficult": ["Education"]}, {"id": "p1s6i19", "text": "Through large model technologies, Volcano Engine is driving innovation across education and scientific research, enhancing personalized learning, research support, and campus management.", "critical": ["Volcano Engine"], "difficult": ["personalized", "technologies", "innovation", "management", "scientific", "education"]}, {"id": "p1s6i20", "text": "Let’s watch a short video to learn more. (Play video after introduction)", "critical": [], "difficult": ["introduction"]}, {"id": "p1s6i21", "text": "Healthcare Industry (2 min 4 sec)", "critical": [], "difficult": ["Healthcare"]}, {"id": "p1s6i22", "text": "Volcano Engine provides intelligent solutions for healthcare and life sciences, with applications across scientific research, hospital management and healthcare services.", "critical": ["Volcano Engine"], "difficult": ["applications", "intelligent", "healthcare", "management", "scientific", "solutions"]}, {"id": "p1s6i23", "text": "Let's watch a short video to learn about our solutions in this field. (Play video after introduction)", "critical": [], "difficult": ["introduction", "solutions"]}, {"id": "p1s6i24", "text": "Culture & Entertainment Industry (1 min 49 sec)", "critical": [], "difficult": ["Entertainment"]}, {"id": "p1s6i25", "text": "The culture and entertainment industry is one of Volcano Engine's core business sectors.", "critical": ["Volcano Engine"], "difficult": ["entertainment"]}, {"id": "p1s6i26", "text": "Leveraging our mature audio and video technologies, user engagement capabilities, and Doubao large model, we provide end-to-end solutions for a wide range of social entertainment scenarios.", "critical": ["Doubao"], "difficult": ["entertainment", "capabilities", "technologies", "end-to-end", "engagement", "Leveraging"]}, {"id": "p1s6i27", "text": "Let's learn more through the following short video.", "critical": [], "difficult": ["following"]}, {"id": "p1s6i28", "text": "In today's AI era, Volcano Engine is committed to providing cutting-edge cloud and AI infrastructure, helping enterprises accelerate digital and intelligent transformation.", "critical": ["Volcano Engine"], "difficult": ["infrastructure", "transformation", "cutting-edge", "enterprises", "intelligent", "accelerate"]}, {"id": "p1s6i29", "text": "Now, let’s move on to the next area, where a special guest is waiting for us.", "critical": [], "difficult": []}]}, {"title": "机器人", "items": [{"id": "p1s7i0", "text": "The intelligent robot in front of you is called Cancan.", "critical": ["Cancan"], "difficult": ["intelligent"]}, {"id": "p1s7i1", "text": "Powered by the Doubao large model, cancan supports voice interaction, visual recognition and a variety of intelligent AI capabilities.", "critical": ["Doubao", "Cancan"], "difficult": ["capabilities", "intelligent", "interaction", "recognition"]}, {"id": "p1s7i2", "text": "You can interact with Cancan naturally through simple voice commands, and it will respond almost instantly.", "critical": ["Cancan"], "difficult": ["instantly", "naturally"]}, {"id": "p1s7i3", "text": "Let me give you an example:", "critical": [], "difficult": []}, {"id": "p1s7i4", "text": "Cancan, could you explain to everyone why you're named Cancan?", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i5", "text": "What's the weather like in Shanghai today?", "critical": [], "difficult": []}, {"id": "p1s7i6", "text": "Cancan, would you like to sing a song for everyone?", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i7", "text": "As I mentioned earlier, Cancan also supports visual recognition capabilities.", "critical": ["Cancan"], "difficult": ["capabilities", "recognition", "mentioned"]}, {"id": "p1s7i8", "text": "Cancan, how many people can you see in front of you?", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i9", "text": "What is the lady/gentleman in front of you wearing?", "critical": [], "difficult": ["gentleman"]}, {"id": "p1s7i10", "text": "Have you heard of traditional Chinese Tai Chi?", "critical": [], "difficult": ["traditional"]}, {"id": "p1s7i11", "text": "Let's ask Cancan to demonstrate a few Tai Chi moves for us.", "critical": ["Cancan"], "difficult": ["demonstrate"]}, {"id": "p1s7i12", "text": "Cancan, could you make a heart gesture for everyone?", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i13", "text": "You can also gently pat Cancan on the head.", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i14", "text": "Cancan will respond by saying, “I can feel your warm touch, and I’m full of energy right now.”", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i15", "text": "Now, let’s say goodbye to Cancan.", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i16", "text": "Thank you, Cancan!", "critical": ["Cancan"], "difficult": []}, {"id": "p1s7i17", "text": "Let’s give Cancan a round of applause!", "critical": ["Cancan"], "difficult": []}]}, {"title": "AIGC", "items": [{"id": "p1s8i0", "text": "What you see here is the final exhibit of today's tour: our AIGC experience area.", "critical": ["AIGC"], "difficult": ["experience"]}, {"id": "p1s8i1", "text": "Every day, countless creators on Douyin use AI technologies to generate and publish creative content.", "critical": ["Douyin"], "difficult": ["technologies", "countless"]}, {"id": "p1s8i2", "text": "You can take pictures here and experience the same AIGC capabilities available on Douyin.", "critical": ["Douyin", "AIGC"], "difficult": ["capabilities", "experience", "available"]}, {"id": "p1s8i3", "text": "If you are interested, feel free to try different creative styles, such as cartoon, underwater, and sweetheart.", "critical": [], "difficult": ["interested", "sweetheart", "underwater", "different"]}, {"id": "p1s8i4", "text": "You can also download apps such as Douyin, Doubao, and Dola from the App Store to explore even more AIGC features.", "critical": ["Doubao", "Douyin", "AIGC"], "difficult": []}, {"id": "p1s8i5", "text": "This concludes our tour of the Volcano Engine Innovation Experience Center.", "critical": ["Volcano Engine"], "difficult": ["Experience", "Innovation", "concludes"]}, {"id": "p1s8i6", "text": "Thank you very much for joining us today.", "critical": [], "difficult": []}, {"id": "p1s8i7", "text": "We hope you enjoyed the experience, and we look forward to welcoming you again in the future.", "critical": [], "difficult": ["experience", "welcoming"]}]}]}];

let page='home',pi=0,si=0,accent=localStorage.getItem('v6Accent')||'us',gender=localStorage.getItem('v6Gender')||'female',configured=false,wavBlob=null,stream=null,audioCtx=null,source=null,processor=null,buffers=[],ttsUrl=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RKEY='showroomV6Results';function allR(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')}catch{return {}}}function saveR(k,v){const r=allR();r[k]=v;localStorage.setItem(RKEY,JSON.stringify(r))}function sk(p=pi,s=si){return `${p}:${s}`}function txt(s){return (s.items||[]).map(x=>x.text).join(' ')}function voiceId(){return `${accent}_${gender}`}
function prog(p){const r=allR(),d=DATA[p];let done=0,sum=0,n=0;d.sections.forEach((_,s)=>{const x=r[`${p}:${s}`];if(x?.completed){done++;sum+=x.total;n++}});return{done,total:d.sections.length,pct:Math.round(done/d.sections.length*100),avg:n?Math.round(sum/n):null}}
function overall(){let total=0,done=0,sum=0,n=0;DATA.forEach((p,i)=>{const q=prog(i);total+=q.total;done+=q.done;if(q.avg!==null){sum+=q.avg*q.done;n+=q.done}});return{done,total,pct:total?Math.round(done/total*100):0,avg:n?Math.round(sum/n):null}}
function nav(body){const o=overall();$('#app').innerHTML=`<div class="nav"><div class="brand">Showroom AI Coach<span class="pro">V6 PRO</span></div><div class="tabs"><button class="${page==='home'?'active':''}" onclick="go('home')">Home</button><button class="${page==='weak'?'active':''}" onclick="go('weak')">Weak Words</button><button class="${page==='history'?'active':''}" onclick="go('history')">History</button></div><div id="status" class="status">Checking…</div></div>${body}`;check()}
async function check(){try{const j=await fetch('/api/status').then(r=>r.json());configured=j.configured;const e=$('#status');if(e){e.textContent=configured?'Real Assessment Connected':'Azure Not Configured';e.className='status '+(configured?'ok':'bad')}}catch{}}
function go(p){page=p;p==='home'?home():p==='weak'?weak():history()}
function home(){page='home';const o=overall();nav(`<div class="hero"><div><h1>Showroom English Certification</h1><p>One full section, one continuous delivery, one real assessment. No simulated scores.</p></div><div class="kpi"><div><b>${o.pct}%</b><span>Overall progress</span></div><div><b>${o.done}/${o.total}</b><span>Sections completed</span></div><div><b>${o.avg??'—'}</b><span>Average score</span></div></div></div><div class="card"><div class="voicePanel"><div><div class="label">Accent</div><div class="seg"><button class="${accent==='us'?'on':''}" onclick="setAccent('us')">🇺🇸 American</button><button class="${accent==='uk'?'on':''}" onclick="setAccent('uk')">🇬🇧 British</button></div></div><div><div class="label">Voice</div><div class="seg"><button class="${gender==='female'?'on':''}" onclick="setGender('female')">Female</button><button class="${gender==='male'?'on':''}" onclick="setGender('male')">Male</button></div></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="previewVoice()">▶ Preview ${VOICES[voiceId()].label}</button><span class="muted">固定 Azure Neural Voice，不调用浏览器随机语音。</span></div><audio id="voicePreview" controls style="display:none"></audio></div><div class="grid2">${DATA.map((p,i)=>{const q=prog(i);return `<div class="card"><h2>${esc(p.name)}</h2><div class="muted">${p.sections.length} sections</div><div class="progress"><i style="width:${q.pct}%"></i></div><div class="row" style="justify-content:space-between"><span class="muted">${q.done}/${q.total} · ${q.pct}%${q.avg!==null?` · Avg ${q.avg}`:''}</span><button class="btn primary" onclick="openCourse(${i})">Open Course</button></div></div>`}).join('')}</div>`)}
function setAccent(a){accent=a;localStorage.setItem('v6Accent',a);home()}function setGender(g){gender=g;localStorage.setItem('v6Gender',g);home()}

function course(){const p=DATA[pi],q=prog(pi),r=allR();nav(`<div class="row" style="margin-bottom:14px"><button class="btn" onclick="home()">← Home</button><span class="muted">${esc(p.name)}</span></div><div class="card"><h2>${esc(p.name)}</h2><div class="progress"><i style="width:${q.pct}%"></i></div><div class="muted">${q.done}/${q.total} completed · ${q.pct}%${q.avg!==null?` · Average ${q.avg}`:''}</div></div><div class="card">${p.sections.map((s,i)=>{const x=r[`${pi}:${i}`];return `<div class="section"><div><b>${esc(s.title)}</b><div class="muted">${x?.completed?`${x.total} · ${x.locale} · ${x.date}`:'Not assessed'}</div></div><button class="btn" onclick="openSection(${i})">${x?'Retake':'Start'}</button></div>`}).join('')}</div>`)}
function openSection(i){si=i;page='section';section()}
function section(){const p=DATA[pi],s=p.sections[si],saved=allR()[sk()];nav(`<div class="row" style="margin-bottom:14px"><button class="btn" onclick="course()">← Sections</button><span class="muted">${esc(p.name)} / ${esc(s.title)}</span></div>${!configured?'<div class="notice">真实评分和 Azure 标准音需要先配置 Speech Key。未连接时系统不会生成任何分数，也不会使用假分数。</div>':''}<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(s.title)}</h2><div class="muted">Whole-section training · ${VOICES[voiceId()].label}</div></div><span class="badge">${accent==='us'?'en-US':'en-GB'}</span></div><div class="script">${esc(txt(s))}</div><div class="row"><button class="btn" onclick="tts(null,false,'modelAudio')">▶ Standard Voice</button><button class="btn" onclick="tts(null,true,'modelAudio')">🐢 Slow Voice</button></div><audio id="modelAudio" controls style="display:none"></audio></div><div class="card"><h2>Real Assessment</h2><div class="record"><div class="muted">${accent==='us'?'American assessment includes real Azure Prosody (stress, intonation, rhythm).':'British assessment uses real en-GB Accuracy / Fluency / Completeness. Azure currently does not return Prosody for en-GB, so V6 does not invent that score.'}</div><div class="row" style="margin-top:12px"><button id="recBtn" class="btn primary" onclick="toggleRec()">🎤 Start Recording</button><button id="scoreBtn" class="btn dark" disabled onclick="assess()">Finish & Get Real Score</button></div><audio id="recAudio" controls style="display:none"></audio></div><div id="result">${scoreHtml(saved)}</div></div>`)}
async function tts(custom,slow,id){if(!configured)return alert('请先配置 Azure Speech。');const text=custom||txt(DATA[pi].sections[si]);const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,slow,voiceId:voiceId()})});if(!r.ok){const j=await r.json().catch(()=>({}));return alert(j.error||'Voice failed')}const b=await r.blob(),a=$('#'+id);if(ttsUrl)URL.revokeObjectURL(ttsUrl);ttsUrl=URL.createObjectURL(b);a.src=ttsUrl;a.style.display='block';a.play()}
async function toggleRec(){const b=$('#recBtn'),s=$('#scoreBtn');if(!processor){try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});buffers=[];audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});source=audioCtx.createMediaStreamSource(stream);processor=audioCtx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>buffers.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(audioCtx.destination);b.textContent='⏹ Stop Recording';s.disabled=true}catch(e){alert('请允许麦克风权限')}}else{processor.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());await audioCtx.close();wavBlob=encodeWav(buffers,16000);processor=null;const a=$('#recAudio');a.src=URL.createObjectURL(wavBlob);a.style.display='block';b.textContent='🎤 Record Again';s.disabled=false}}
function encodeWav(chunks,sr){let len=chunks.reduce((n,c)=>n+c.length,0),all=new Float32Array(len),o=0;for(const c of chunks){all.set(c,o);o+=c.length}const ab=new ArrayBuffer(44+len*2),v=new DataView(ab),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len*2,true);let p=44;for(const x of all){let q=Math.max(-1,Math.min(1,x));v.setInt16(p,q<0?q*0x8000:q*0x7fff,true);p+=2}return new Blob([v],{type:'audio/wav'})}
async function assess(){if(!configured)return alert('请先配置 Azure Speech。');if(!wavBlob)return;const box=$('#result');box.innerHTML='<div class="muted" style="padding:18px 0">Azure is analyzing your full section…</div>';const b64=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.onerror=no;f.readAsDataURL(wavBlob)});const r=await fetch('/api/assess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({referenceText:txt(DATA[pi].sections[si]),audioBase64:b64,accent})});const j=await r.json();if(!r.ok){box.innerHTML=`<div class="notice">${esc(j.error||'Assessment failed')}</div>`;return}j.completed=true;j.date=new Date().toLocaleString();saveR(sk(),j);box.innerHTML=scoreHtml(j)}
function scoreHtml(r){if(!r)return'';const st=r.total>=85?'PASS':r.total>=75?'PRACTICE RECOMMENDED':'RETRY';const weak=r.issues||[];return `<div class="scoreHero"><div class="big">${r.total}</div><div><span class="badge">${st}</span><div class="muted" style="margin-top:7px">Microsoft Azure Speech · ${r.locale}</div></div></div><div class="scoregrid"><div><b>${r.accuracy}</b><span>Pronunciation Accuracy</span></div><div><b>${r.fluency}</b><span>Fluency & Pausing</span></div><div><b>${r.prosody??'—'}</b><span>${r.prosodySupported?'Stress · Intonation · Rhythm':'Prosody not returned for en-GB'}</span></div><div><b>${r.completeness}</b><span>Script Completeness</span></div></div>${weak.length?`<div style="margin-top:20px"><h3>Priority Issues</h3>${weak.slice(0,15).map(w=>`<div class="issue"><div><b>${esc(w.word)}</b><div class="muted">${esc(w.errorType||'')}</div></div><div class="badText">${Math.round(w.accuracy)} / 100</div></div>`).join('')}</div>`:'<div class="muted" style="margin-top:16px">No major word-level issues returned.</div>'}`}
function weak(){page='weak';const map={};Object.values(allR()).forEach(r=>(r.issues||[]).forEach(w=>{const k=(w.word||'').toLowerCase();if(!k)return;if(!map[k])map[k]={word:w.word,count:0,sum:0};map[k].count++;map[k].sum+=Number(w.accuracy||0)}));const arr=Object.values(map).sort((a,b)=>(a.sum/a.count)-(b.sum/b.count));nav(`<div class="card"><h2>Weak Words</h2><div class="muted">Aggregated from real Azure word-level results.</div><div style="margin-top:14px">${arr.length?arr.map(x=>`<span class="weakTag"><b>${esc(x.word)}</b><span class="badText">${Math.round(x.sum/x.count)}</span><span class="muted">×${x.count}</span></span>`).join(''):'<div class="muted">No weak words yet.</div>'}</div></div>`)}
function history(){page='history';const rows=[];DATA.forEach((p,pidx)=>p.sections.forEach((s,sidx)=>{const r=allR()[`${pidx}:${sidx}`];if(r)rows.push({course:p.name,section:s.title,...r})}));rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));nav(`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Training History</h2><div class="muted">Saved on this device.</div></div><button class="btn" onclick="window.print()">Print / Save PDF</button></div><table><thead><tr><th>Course</th><th>Section</th><th>Score</th><th>Accuracy</th><th>Fluency</th><th>Prosody</th><th>Completeness</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.course)}</td><td>${esc(r.section)}</td><td><b>${r.total}</b></td><td>${r.accuracy}</td><td>${r.fluency}</td><td>${r.prosody??'—'}</td><td>${r.completeness}</td><td>${esc(r.date)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No records yet.</td></tr>'}</tbody></table></div>`)}
home();
</script></body></html>
